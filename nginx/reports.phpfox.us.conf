
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


upstream reportportal_gateway {
    server 127.0.0.1:8090;
    keepalive 16;
}


server {
    server_name reports.phpfox.us;
    # ReportPortal accepts log attachments/screenshots; raise the default 1m limit.
    client_max_body_size 128m;

    location / {
        proxy_pass http://reportportal_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;

        # WebSocket support (ReportPortal UI keeps a live-update socket open).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Advertise HTTP/3 so browsers that connected over TCP switch to QUIC
        # on the next request. Requires nginx built with --with-http_v3_module
        # (check: nginx -V 2>&1 | grep -o with-http_v3_module).
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }
    http2 on;
    http3 on;
    quic_retry on;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    listen [::]:443 quic reuseport ipv6only=on;
    listen 443 quic reuseport;
    ssl_certificate /etc/letsencrypt/live/reports.phpfox.us/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reports.phpfox.us/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}




server {
    if ($host = reports.phpfox.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    listen [::]:80;
    server_name reports.phpfox.us;
    return 404; # managed by Certbot
}